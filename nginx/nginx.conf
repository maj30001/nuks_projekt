events {
    worker_connections 1024;
}

http {
    # 1. Preusmeritev vsega HTTP prometa na HTTPS (vrata 80 -> 443)
    server {
        listen 80;
        server_name nuks.v4.si;
        return 301 https://$host$request_uri;
    }

    # 2. Glavni HTTPS strežnik z vašimi pravili
    server {
        listen 443 ssl;
        server_name nuks.v4.si;

        # Poti do Let's Encrypt certifikatov (znotraj kontejnerja)
        ssl_certificate /etc/letsencrypt/live/nuks.v4.si/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nuks.v4.si/privkey.pem;
        
        # Priporočene varnostne nastavitve za SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Tvoje specifične nastavitve
        client_max_body_size 100M;

        # Dockerjev interni DNS strežnik, ki dinamično razrešuje imena kontejnerjev
        resolver 127.0.0.11 valid=30s;

        # 1. Usmerjanje prometa za FRONTEND
        location / {
            set $target_frontend http://frontend:5173;
            proxy_pass $target_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 2. Usmerjanje prometa za User Service
        location /api/users {
            set $target_users http://user-service:8000;
            proxy_pass $target_users;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 3. Usmerjanje prometa za Post Service
        location /api/posts {
            set $target_posts http://post-service:8001;
            proxy_pass $target_posts;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}